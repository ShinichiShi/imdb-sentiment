server {
    listen 8501;
    root /usr/share/nginx/html;
    index index.html;
    add_header Cache-Control "no-cache";   # always revalidate so edits show immediately

    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_set_header Host $host;
    }
    location /predict/ {
        proxy_pass http://api:8000/predict/;
    }
}
